# Reverse proxy for the Buildtruck admin dashboard (Next.js on 127.0.0.1:3000).
# Install as /etc/nginx/sites-available/buildtruck-admin.
# `certbot --nginx` adds the HTTPS server block and the HTTP->HTTPS redirect.

# Upgrade only requests that ask for it (WebSocket); plain requests keep "close".
map $http_upgrade $buildtruck_admin_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.globaltimetrack.com;

    server_tokens off;
    # The dashboard sends its data to the API (another domain); requests here are
    # page and asset loads only.
    client_max_body_size 1m;

    # Next is configured with compress: false (next.config.ts); nginx compresses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/x-component application/javascript
               application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $buildtruck_admin_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
